name: build
on: [pull_request, push]
jobs:
  build:
    name: Build - ${{ matrix.platform.os-name }}
    strategy:
      matrix:
        platform:
          - os-name: linux-x86_64
            runs-on: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            output-file: libwhisp_rs.so
          - os-name: linux-aarch64
            runs-on: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            output-file: libwhisp_rs.so
          - os-name: windows-x86_64
            runs-on: windows-2025-vs-2026
            target: x86_64-pc-windows-msvc
            arch: x64
            output-file: whisp_rs.dll
          - os-name: windows-aarch64
            runs-on: windows-11-arm
            target: aarch64-pc-windows-msvc
            arch: arm64
            output-file: whisp_rs.dll
          - os-name: macos-x86_64
            runs-on: macOS-26-intel
            target: x86_64-apple-darwin
            output-file: libwhisp_rs.dylib
          - os-name: macos-aarch64
            runs-on: macOS-26
            target: aarch64-apple-darwin
            output-file: libwhisp_rs.dylib
    runs-on: ${{ matrix.platform.runs-on }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: ${{ matrix.platform.target }}
      - name: Install ALSA library and headers on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Use Visual Studio developer shell on Windows
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.platform.arch }}
      - name: Build library
        run: "cargo build --release --target ${{ matrix.platform.target }}"
      - name: Capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform.os-name }}
          path: target/${{ matrix.platform.target }}/release/${{ matrix.platform.output-file }}
  package-jar:
    name: Package Java bindings JAR
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download native libraries
        uses: actions/download-artifact@v8
        with:
          path: downloaded
      - name: Lay out native resources
        run: |
          for dir in downloaded/*/; do
            name=$(basename "$dir")
            mkdir -p java/lib/src/main/resources/natives/$name
            cp "$dir"/* java/lib/src/main/resources/natives/$name/
          done
          cp espeak-ng-data.zip java/lib/src/main/resources/
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build JAR
        working-directory: java
        run: ./gradlew :lib:jar
      - name: Capture JAR
        uses: actions/upload-artifact@v7
        with:
          name: whisprs-jar
          path: java/lib/build/libs/*.jar
